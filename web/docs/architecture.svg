<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1240" viewBox="0 0 1600 1240" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#3f3f46"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1d6fd8"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#b3203a"/>
    </marker>
    <style>
      .h1 { font-size: 30px; font-weight: 700; fill: #18181b; }
      .sub { font-size: 16px; fill: #52525b; }
      .col { font-size: 13px; font-weight: 700; letter-spacing: 0.08em; fill: #71717a; }
      .t { font-size: 17px; font-weight: 700; fill: #18181b; }
      .tw { font-size: 17px; font-weight: 700; fill: #ffffff; }
      .s { font-size: 13.5px; fill: #3f3f46; }
      .sw { font-size: 13.5px; fill: #f4f4f5; }
      .m { font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 12.5px; fill: #27272a; }
      .lbl { font-size: 12.5px; fill: #27272a; }
      .lblb { font-size: 12.5px; fill: #1d6fd8; font-weight: 600; }
      .lblr { font-size: 12.5px; fill: #b3203a; font-weight: 600; }
      .n { font-size: 13px; font-weight: 700; fill: #ffffff; }
      .step { font-size: 14px; fill: #27272a; }
    </style>
  </defs>

  <rect width="1600" height="1240" fill="#fbf8f6"/>

  <!-- Title -->
  <text x="40" y="58" class="h1">duPont REGISTRY Live — streaming platform</text>
  <text x="40" y="86" class="sub">How dpr-livestreaming, the live auction site (Next.js), the dR Garage app (Flutter) and Agora fit together</text>

  <!-- Legend chips -->
  <g transform="translate(1040,46)">
    <rect width="14" height="14" rx="3" fill="#b3203a"/><text x="20" y="12" class="lbl">Our code (dpr-livestreaming)</text>
    <rect x="230" width="14" height="14" rx="3" fill="#1d6fd8"/><text x="250" y="12" class="lbl">Agora (managed service)</text>
    <rect y="24" width="14" height="14" rx="3" fill="#3f3f46"/><text x="20" y="36" class="lbl">Platforms that embed the stream</text>
    <rect x="230" y="24" width="14" height="14" rx="3" fill="#d97706"/><text x="250" y="36" class="lbl">dR identity (Keycloak)</text>
  </g>

  <!-- Column headings -->
  <text x="40" y="128" class="col">WHO USES IT</text>
  <text x="560" y="128" class="col">DPR-LIVESTREAMING · NEXT.JS · OUR IMPLEMENTATION</text>
  <text x="1170" y="128" class="col">AGORA · WHAT WE USE</text>

  <!-- ───────────── Left column ───────────── -->
  <!-- Host -->
  <rect x="40" y="142" width="440" height="128" rx="14" fill="#ffffff" stroke="#b3203a" stroke-width="2"/>
  <text x="60" y="172" class="t">Host · dR staff (browser)</text>
  <text x="60" y="196" class="s">Opens /host · Preview camera → Start stream</text>
  <text x="60" y="217" class="s">Multi host: up to 4 cameras (co-hosts join)</text>
  <text x="60" y="238" class="s">Moderates chat: delete message, mute viewer</text>
  <text x="60" y="259" class="s">Only verified @dupontregistry / @dupontregistrygroup emails</text>

  <!-- Keycloak -->
  <rect x="40" y="290" width="440" height="96" rx="14" fill="#fff7ed" stroke="#d97706" stroke-width="2"/>
  <text x="60" y="320" class="t">Keycloak  (dR identity · realm mrkt)</text>
  <text x="60" y="344" class="s">Browser sign-in with PKCE (keycloak-js)</text>
  <text x="60" y="366" class="s">Our server checks the JWT: JWKS, azp, verified dr/drg email</text>

  <!-- drlive-frontend -->
  <rect x="40" y="406" width="440" height="200" rx="14" fill="#27272a"/>
  <text x="60" y="436" class="tw">Live auction site · drlive-frontend (Next.js)</text>
  <text x="60" y="462" class="sw">LiveStreamPlugin.tsx loads dpr-live.js (next/script)</text>
  <text x="60" y="484" class="sw">GET /api/auctions/livestream/viewer-ticket</text>
  <text x="76" y="504" class="sw">→ signs a viewer ticket (HS256, ≤ 15 min) for the</text>
  <text x="76" y="524" class="sw">   signed-in user; null for guests</text>
  <text x="60" y="548" class="sw">Sign in / out → DprLive.refreshViewer()</text>
  <text x="60" y="570" class="sw">“Sign in to chat” → opens the site's sign-in modal</text>
  <text x="60" y="592" class="sw">CSP allows the livestream origin (script, frame, connect)</text>

  <!-- Garage -->
  <rect x="40" y="626" width="440" height="200" rx="14" fill="#27272a"/>
  <text x="60" y="656" class="tw">dR Garage app (Flutter · iOS / Android)</text>
  <text x="60" y="682" class="sw">Native LIVE pill: polls /api/stream/status</text>
  <text x="60" y="704" class="sw">Join → WebView of /embed/live?platform=garage&amp;ui=dock</text>
  <text x="60" y="726" class="sw">JS channel DprLiveNative ← LOGIN_REQUEST, STATE, CLOSE</text>
  <text x="60" y="748" class="sw">Garage backend signs the viewer ticket (iss: garage)</text>
  <text x="76" y="768" class="sw">→ runJavaScript("DprLive.setViewer(ticket)")</text>
  <text x="60" y="792" class="sw">Same player, chat and reactions as the web</text>
  <text x="60" y="812" class="sw">Viewers watch as guests; sign in to chat / react</text>

  <!-- ───────────── Middle column ───────────── -->
  <rect x="560" y="142" width="530" height="684" rx="18" fill="#fdf2f4" stroke="#b3203a" stroke-width="2"/>

  <!-- Pages -->
  <rect x="580" y="162" width="490" height="146" rx="12" fill="#ffffff" stroke="#e9c2ca"/>
  <text x="600" y="190" class="t">Pages</text>
  <text x="600" y="214" class="m">/host</text><text x="700" y="214" class="s">Host console (Keycloak gate): stage, chat, start / end</text>
  <text x="600" y="238" class="m">/embed/live</text><text x="700" y="238" class="s">Player: video tiles, chat, reactions, viewer count</text>
  <text x="600" y="262" class="m">/docs</text><text x="700" y="262" class="s">Integration guides: Next.js, Flutter, HTML</text>
  <text x="600" y="290" class="s">Agora runs in the browser: agora-rtc-sdk-ng + agora-rtm-sdk</text>

  <!-- Plugin -->
  <rect x="580" y="322" width="490" height="128" rx="12" fill="#ffffff" stroke="#e9c2ca"/>
  <text x="600" y="350" class="t">dpr-live.js plugin  (one script for every website)</text>
  <text x="600" y="374" class="s">Shadow DOM LIVE pill → Join → dock with iframe /embed/live</text>
  <text x="600" y="396" class="s">postMessage bridge (exact origin): VIEWER_TICKET, THEME, MUTE…</text>
  <text x="600" y="418" class="s">← READY, STATE, LOGIN_REQUEST, TICKET_EXPIRED</text>
  <text x="600" y="440" class="s">Nothing connects to video before Join · light / dark follows the site</text>

  <!-- API -->
  <rect x="580" y="464" width="490" height="224" rx="12" fill="#ffffff" stroke="#e9c2ca"/>
  <text x="600" y="492" class="t">API routes</text>
  <text x="600" y="516" class="m">POST /api/token/host</text><text x="830" y="516" class="s">Keycloak JWT → publisher tokens</text>
  <text x="600" y="538" class="m">POST /api/token/viewer</text><text x="830" y="538" class="s">ticket (or guest) → viewer tokens</text>
  <text x="600" y="560" class="m">/api/editor/stream/*</text><text x="830" y="560" class="s">start · stop · handover</text>
  <text x="600" y="582" class="m">/api/hosts/heartbeat</text><text x="830" y="582" class="s">who is on camera (max 1–4)</text>
  <text x="600" y="604" class="m">GET /api/stream/status</text><text x="830" y="604" class="s">public, CDN-cacheable (2 s)</text>
  <text x="600" y="626" class="m">/api/live-stream/events</text><text x="830" y="626" class="s">SSE: status + counts (≤ 1/s)</text>
  <text x="600" y="648" class="m">POST /api/stream/react</text><text x="830" y="648" class="s">reaction totals, 5/s per person</text>
  <text x="600" y="670" class="m">/api/stream/viewers</text><text x="830" y="670" class="s">count · /snapshot: chat history</text>

  <!-- State -->
  <rect x="580" y="702" width="490" height="108" rx="12" fill="#ffffff" stroke="#e9c2ca"/>
  <text x="600" y="730" class="t">Server state (single instance today)</text>
  <text x="600" y="754" class="s">Stream record, cameras, reaction totals, viewer count</text>
  <text x="600" y="776" class="s">Last 50 chat messages + muted list → .data/stream.json</text>
  <text x="600" y="798" class="s">Rate limits per IP / person · Redis when we run several instances</text>

  <!-- ───────────── Right column ───────────── -->
  <rect x="1170" y="142" width="390" height="684" rx="18" fill="#eef5ff" stroke="#1d6fd8" stroke-width="2"/>

  <!-- RTC -->
  <rect x="1190" y="162" width="350" height="226" rx="12" fill="#ffffff" stroke="#b9d3f5"/>
  <text x="1210" y="190" class="t">Agora RTC · video</text>
  <text x="1210" y="214" class="s">Channel “Live” (one stream at a time)</text>
  <text x="1210" y="238" class="s">Hosts publish camera + mic</text>
  <text x="1210" y="260" class="s">   (1–4 hosts → split screen)</text>
  <text x="1210" y="284" class="s">Viewers subscribe only</text>
  <text x="1210" y="308" class="s">Real-time: well under a second of delay</text>
  <text x="1210" y="332" class="s">SDK: agora-rtc-sdk-ng 4.24</text>
  <text x="1210" y="356" class="s">Token renewal before expiry</text>
  <text x="1210" y="378" class="s">(host and viewer)</text>

  <!-- RTM -->
  <rect x="1190" y="402" width="350" height="226" rx="12" fill="#ffffff" stroke="#b9d3f5"/>
  <text x="1210" y="430" class="t">Agora RTM 2 · signaling</text>
  <text x="1210" y="454" class="s">Channel dprlive-{sessionId}</text>
  <text x="1210" y="478" class="s">Chat messages (real time)</text>
  <text x="1210" y="500" class="s">Reaction animations (batched 1/s)</text>
  <text x="1210" y="522" class="s">Delete / mute from hosts</text>
  <text x="1210" y="544" class="s">Presence → viewer count</text>
  <text x="1210" y="566" class="s">One RTM id per connection:</text>
  <text x="1210" y="588" class="m">{identity}~{tag}</text>
  <text x="1210" y="612" class="s">SDK: agora-rtm-sdk 2.3</text>

  <!-- Tokens -->
  <rect x="1190" y="642" width="350" height="168" rx="12" fill="#ffffff" stroke="#b9d3f5"/>
  <text x="1210" y="670" class="t">Tokens (agora-token, server)</text>
  <text x="1210" y="694" class="s">Built by our API with the</text>
  <text x="1210" y="716" class="s">App Certificate — never sent</text>
  <text x="1210" y="738" class="s">to a browser or app</text>
  <text x="1210" y="762" class="s">RTC: publisher (host) / subscriber</text>
  <text x="1210" y="784" class="s">RTM: chat id bound to the user</text>
  <text x="1210" y="804" class="s">(host_ · u_platform_ · anon_)</text>

  <!-- ───────────── Arrows ───────────── -->
  <!-- 1 Host ↔ Keycloak -->
  <line x1="200" y1="270" x2="200" y2="288" stroke="#d97706" stroke-width="2.5" marker-end="url(#arrow)"/>
  <!-- 2 Host → /host -->
  <line x1="480" y1="210" x2="578" y2="210" stroke="#b3203a" stroke-width="2.5" marker-end="url(#arrow-red)"/>
  <!-- 3 drlive → plugin -->
  <line x1="480" y1="470" x2="578" y2="400" stroke="#b3203a" stroke-width="2.5" marker-end="url(#arrow-red)"/>
  <!-- 4 Garage → /embed/live (WebView) -->
  <path d="M480 700 C 530 700, 520 250, 578 244" fill="none" stroke="#b3203a" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrow-red)"/>
  <!-- 5 Garage → status -->
  <line x1="480" y1="740" x2="578" y2="606" stroke="#3f3f46" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Pages → RTC -->
  <line x1="1070" y1="214" x2="1188" y2="250" stroke="#1d6fd8" stroke-width="2.5" marker-start="url(#arrow-blue)" marker-end="url(#arrow-blue)"/>
  <!-- Pages → RTM -->
  <line x1="1070" y1="262" x2="1188" y2="480" stroke="#1d6fd8" stroke-width="2.5" marker-start="url(#arrow-blue)" marker-end="url(#arrow-blue)"/>
  <!-- API → tokens -->
  <line x1="1070" y1="527" x2="1188" y2="720" stroke="#1d6fd8" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow-blue)"/>

  <!-- Step badges on arrows -->
  <g><circle cx="222" cy="279" r="12" fill="#d97706"/><text x="222" y="284" text-anchor="middle" class="n">1</text></g>
  <g><circle cx="529" cy="210" r="12" fill="#b3203a"/><text x="529" y="215" text-anchor="middle" class="n">2</text></g>
  <g><circle cx="529" cy="435" r="12" fill="#b3203a"/><text x="529" y="440" text-anchor="middle" class="n">3</text></g>
  <g><circle cx="508" cy="560" r="12" fill="#b3203a"/><text x="508" y="565" text-anchor="middle" class="n">4</text></g>
  <g><circle cx="545" cy="660" r="12" fill="#3f3f46"/><text x="545" y="665" text-anchor="middle" class="n">3</text></g>
  <g><circle cx="1129" cy="232" r="12" fill="#1d6fd8"/><text x="1129" y="237" text-anchor="middle" class="n">6</text></g>
  <g><circle cx="1129" cy="371" r="12" fill="#1d6fd8"/><text x="1129" y="376" text-anchor="middle" class="n">7</text></g>
  <g><circle cx="1129" cy="623" r="12" fill="#1d6fd8"/><text x="1129" y="628" text-anchor="middle" class="n">5</text></g>
  <text x="1129" y="262" class="lblb" text-anchor="middle">video</text>
  <text x="1124" y="420" class="lblb" text-anchor="end">chat</text>
  <text x="1129" y="653" class="lblb" text-anchor="middle">tokens</text>
  <text x="529" y="192" class="lblr" text-anchor="middle">/host</text>

  <!-- ───────────── Steps ───────────── -->
  <rect x="40" y="852" width="1520" height="356" rx="16" fill="#ffffff" stroke="#e4e4e7"/>
  <text x="64" y="886" class="t">How a stream works, step by step</text>

  <g transform="translate(64,912)">
    <circle cx="11" cy="11" r="11" fill="#d97706"/><text x="11" y="16" text-anchor="middle" class="n">1</text>
    <text x="34" y="16" class="step"><tspan font-weight="700">Host signs in.</tspan> /host sends the host to Keycloak (PKCE). Every host API call carries the Keycloak JWT; the server checks signature, client and a verified dr/drg email.</text>
  </g>
  <g transform="translate(64,948)">
    <circle cx="11" cy="11" r="11" fill="#b3203a"/><text x="11" y="16" text-anchor="middle" class="n">2</text>
    <text x="34" y="16" class="step"><tspan font-weight="700">Start stream.</tspan> Preview camera → Start: the server opens a session (title, single / multi host, max cameras) and hands out a publisher token. Co-hosts press Join as co-host.</text>
  </g>
  <g transform="translate(64,984)">
    <circle cx="11" cy="11" r="11" fill="#b3203a"/><text x="11" y="16" text-anchor="middle" class="n">3</text>
    <text x="34" y="16" class="step"><tspan font-weight="700">The LIVE pill appears.</tspan> The plugin (auction site) and the native pill (Garage) poll the public status — a cacheable GET, every 5 s while live, 10 s when offline.</text>
  </g>
  <g transform="translate(64,1020)">
    <circle cx="11" cy="11" r="11" fill="#b3203a"/><text x="11" y="16" text-anchor="middle" class="n">4</text>
    <text x="34" y="16" class="step"><tspan font-weight="700">Viewer presses Join.</tspan> The player /embed/live opens (iframe on the web, WebView in Garage). The platform signs a viewer ticket for its signed-in user and passes it in.</text>
  </g>
  <g transform="translate(64,1056)">
    <circle cx="11" cy="11" r="11" fill="#1d6fd8"/><text x="11" y="16" text-anchor="middle" class="n">5</text>
    <text x="34" y="16" class="step"><tspan font-weight="700">Tokens.</tspan> /api/token/viewer checks the ticket and returns Agora RTC + RTM tokens (signed-in: can chat and react; guest: watch only). The App Certificate stays on the server.</text>
  </g>
  <g transform="translate(64,1092)">
    <circle cx="11" cy="11" r="11" fill="#1d6fd8"/><text x="11" y="16" text-anchor="middle" class="n">6</text>
    <text x="34" y="16" class="step"><tspan font-weight="700">Video.</tspan> Browsers and the app connect straight to Agora RTC: hosts publish, viewers subscribe. Our server never carries video.</text>
  </g>
  <g transform="translate(64,1128)">
    <circle cx="11" cy="11" r="11" fill="#1d6fd8"/><text x="11" y="16" text-anchor="middle" class="n">7</text>
    <text x="34" y="16" class="step"><tspan font-weight="700">Chat and reactions.</tspan> Messages and reaction animations go over Agora RTM in real time. Reaction totals are counted by our server (5/s per person); the lead host</text>
    <text x="34" y="36" class="step">reports the viewer count; both reach every screen through SSE (/api/live-stream/events, at most once a second). Chat history and mutes are saved by the host for late joiners.</text>
  </g>
</svg>
